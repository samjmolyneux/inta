<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Plotly Box Plot</title>
    <script
      src="https://cdn.plot.ly/plotly-3.1.0.min.js"
      integrity="sha384-DAxS2fhSGacPW3IdpTjDpu+KotwjM8aHsfrkZRnfYyJIhAHoDav7jAJ+NmYcp6PL"
      crossorigin="anonymous"
      charset="utf-8"
      defer
    ></script>
    <style>
      {% include "style.css" %}
    </style>
  </head>
  <body>
    <noscript>
      <div class="no-js-banner" role="alert">
        ERROR: You have disabled JavaScript in your browser. Enable JavaScript
        to display the plot.
      </div>
    </noscript>

    <div id="cdn-fail" role="alert" hidden>
      ERROR: Could not load required dependency Plotly from cdn.plot.ly. This
      means you are not connected to the internet or your firewall is blocking
      access.
    </div>

    <div id="box-plot-container">
      <div id="box-plot-div"></div>
    </div>
    <script type="application/json" id="plot-config">
      {{ plot_config|tojson }}
    </script>
    <script type="module">
      {% include "script.js" %}
    </script>
  </body>
</html>

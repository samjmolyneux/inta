{% extends "bases/base.html" %}

{% block main %}
  <div id="plot-div"></div>

  <div id="select-threshold-controls">
    <div id="threshold-display">Threshold: <span id="threshold-value">0.5</span></div>

    <input
      type="range"
      id="threshold-slider"
      min="{{ slider_min }}"
      max="{{ slider_max }}"
      step="{{ slider_step }}"
      value="{{ slider_default }}"
    />

    <div class="threshold-row">
      <label for="threshold-input"> Set Threshold: </label>
      <input type="number" id="threshold-input" step="any" inputmode="decimal" />
    </div>

    <div class="threshold-row">
      <label for="recall-input">Set Recall:</label>
      <input
        type="number"
        id="recall-input"
        step="any"
        min="0"
        max="100"
        inputmode="decimal"
      />
    </div>
  </div>
{% endblock %}

{% block scripts %}
  <!-- prettier-ignore-start -->
  <script type="module">
    {% include "select_threshold/script.js" %}
  </script>
  <!-- prettier-ignore-end -->
{% endblock %}

{% block styles %}
  <!-- prettier-ignore-start -->
  <style>
    {% include "select_threshold/style.css" %}
  </style>
  <!-- prettier-ignore-end -->
{% endblock %}

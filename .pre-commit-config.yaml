minimum_pre_commit_version: "4.7.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: end-of-file-fixer
        exclude_types:
          - svg
      - id: name-tests-test
        args: ["--pytest-test-first"]
      # - id: no-commit-to-branch
      #   args: ["--branch", "main", "--branch", "master"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-merge-conflict
      - id: check-json
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-tabs
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-lint
        files: ^pyproject\.toml$
        # TODO: Revisit the schema override after the upstream fix (issue #44).
        args:
          - --schema
          - https://www.schemastore.org/pyproject.json
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
  - repo: local
    # ESLint's config imports plugins from the project.
    # Run npm ci before these hooks, including in CI.
    hooks:
      - id: eslint
        name: ESLint
        entry: npm exec --offline --no -- eslint
        language: system
        files: \.(?:[cm]?js|jsx|tsx?|html?)$
        args: ["--max-warnings=0", "--no-warn-ignored"]
      - id: es-check
        name: JavaScript browser compatibility (ES Check)
        entry: npm run lint:compat
        language: system
        files: ^(?:src/.*\.js|package(?:-lock)?\.json)$
        pass_filenames: false
      - id: stylelint
        name: Stylelint
        entry: npm exec --offline --no -- stylelint
        language: system
        files: \.css$
        args: ["--max-warnings=0"]
      - id: prettier
        name: Prettier
        entry: npm exec --offline --no -- prettier
        language: system
        args: [--check]
        files: \.(css|html|js|json|md|ya?ml)$
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.25.0
    hooks:
      - id: toml-sort
        args: [--check]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
